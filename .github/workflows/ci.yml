name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读权限就够：这个工作流不产出任何东西，只验证
permissions:
  contents: read

jobs:
  test:
    name: 单元测试与编译
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;34.0.0" > /dev/null

      # 注意：这里**刻意不下载模型**（语音 65MB + 手势 7.8MB）。
      # 单元测试和编译都不需要它们，assets 缺失不影响构建，
      # 所以 CI 能跑得很快。真正需要模型的只有发版流程。

      - name: 单元测试
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: 编译 debug 包
        # 没有签名密钥时会产出未签名的包，这一步只验证「能不能编过」
        run: ./gradlew --no-daemon assembleDebug

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
