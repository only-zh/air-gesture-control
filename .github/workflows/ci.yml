name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读权限就够：这个工作流不产出任何东西，只验证
permissions:
  contents: read

jobs:
  test:
    name: 单元测试与编译
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 不用 android-actions/setup-android：它在本仓库连续两次失败在
      # 「安装 Android SDK」这一步，而日志需要管理员权限才能读，无法排查。
      # 这个脚本是显式下载 cmdline-tools，逻辑与 tools/setup-toolchain.sh 一致，
      # 并且已在本地完整验证过。
      - name: 安装 Android SDK
        run: bash tools/ci-setup-android-sdk.sh

      # 注意：这里**刻意不下载模型**（语音 65MB + 手势 7.8MB）。
      # 单元测试和编译都不需要它们，assets 缺失不影响构建，
      # 所以 CI 能跑得很快。真正需要模型的只有发版流程。

      - name: 单元测试
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: 编译 debug 包
        # 没有签名密钥时会产出未签名的包，这一步只验证「能不能编过」
        run: ./gradlew --no-daemon assembleDebug

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
